name: Feature request
description: Suggest a product or developer improvement for UniMarket.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem are we trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true

  - type: textarea
    id: user_flow
    attributes:
      label: User flow
      description: Describe the expected flow if this gets implemented.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add tradeoffs, references, or screenshots if useful.
    validations:
      required: false
