name: Bug report
description: Report a product or implementation problem in UniMarket.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is going wrong?
      placeholder: A clear short description of the issue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include platform details such as WeChat DevTools version, OS, and page involved.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add screenshots or extra context if helpful. Do not attach private personal data.
    validations:
      required: false
